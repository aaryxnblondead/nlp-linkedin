services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      POSTGRES_SERVER: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - ./uploaded_resumes:/app/uploaded_resumes
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
