[tool.ruff]
line-length = 100
extend-exclude = ["frontend/node_modules", "**/__pycache__/**"]

[tool.ruff.lint]
select = [
  "E","F","I",
]
ignore = [
  "E501", # line length (we cap at 100 but let ruff format slide)
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["frontend/node_modules", "**/__pycache__", "**/migrations"]
